name: Deploy to GitHub Pages

# Every push to main rebuilds and publishes the site. The base path is
# derived from the repository name, so this works whether the repo is
# called "the-resources-by-anik" or anything else.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push finish rather than
# cancelling it, so main and the live site cannot drift apart.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Build
        # A project site is served from https://USER.github.io/REPO/, so the
        # bundle must be built for that sub-path.
        run: |
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
          test -f dist/index.html
          test -f dist/content/manifest.json
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

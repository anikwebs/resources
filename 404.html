<script>
  /* Set the theme before first paint so there is no flash. */
  try {
    var t = JSON.parse(localStorage.getItem('rha:theme') || 'null')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    document.documentElement.dataset.theme = t
    document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#12110d' : '#f4f1ea'
    var s = JSON.parse(localStorage.getItem('rha:scale') || '1')
    if (s) document.documentElement.style.setProperty('--reader-scale', s)
  } catch (e) {}
</script>

  <link rel="modulepreload" crossorigin href="/resources/assets/views-B7S8XgD6.js">

<body>
<!-- Not href="#main": this is a hash-routed app, so a bare fragment
     would be read as a route. The handler focuses the region instead. -->
<button class="skip" id="skip" type="button">Skip to content</button>

<!-- First paint, replaced as soon as the app hydrates -->
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-mark">TR</div>
  <div class="boot-bar"><span></span></div>
  <p class="boot-note">The Resources by Anik — loading the library</p>
</div>

<div id="app"></div>

<script>
  /* If the app has not hydrated in twelve seconds the bundle failed
     to load. Say so plainly rather than spinning forever (§58). */
  setTimeout(function () {
    var b = document.getElementById('boot')
    var a = document.getElementById('app')
    if (!b || b.classList.contains('gone') || (a && a.children.length)) return
    b.innerHTML = '<div class="boot-mark">TR</div>'
      + '<p style="max-width:44ch;text-align:center;line-height:1.6;font-size:.95rem">'
      + 'The library did not finish loading. This is usually a slow or blocked connection.'
      + '</p>'
      + '<button onclick="location.reload()" style="padding:10px 18px;border-radius:8px;border:1px solid currentColor;background:none;cursor:pointer;font:inherit">Try again</button>'
  }, 12000)
</script>

<noscript>
  <div style="max-width:62ch;margin:12vh auto;padding:0 24px;font-family:Georgia,serif;line-height:1.6">
    <h1 style="font-size:1.8rem">The Resources by Anik</h1>
    <p>This is a practical library of situation playbooks, lessons, decision tools and an AI working method. It runs entirely in your browser, so it needs JavaScript enabled.</p>
    <p>Nothing is sent anywhere — your progress and notes stay on your own device.</p>
  </div>
</noscript>

</body>
